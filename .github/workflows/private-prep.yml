name: Private prep of a PR branch

# Fork-only helper, started by hand from the Actions tab or the API with a
# branch name and a list of test files. It checks the branch out, regenerates
# the localizations and formats the code exactly as the project's own tools do
# (there is no local Dart to do that), commits the result back to the branch,
# then runs the analyzer and the given tests and reports.
#
# It lives on the fork's default branch only, so the branches it prepares stay
# free of any fork-specific files.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to prepare (for example pr/fix-windows-region-download)'
        required: true
      tests:
        description: 'Space-separated test files or folders to run'
        required: true

permissions:
  contents: write

concurrency:
  group: private-prep-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat .github/flutter-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: stable

      - name: Add swap for build_runner
        run: |
          if sudo fallocate -l 12G /mnt/codegen.swap \
            && sudo chmod 600 /mnt/codegen.swap \
            && sudo mkswap /mnt/codegen.swap >/dev/null \
            && sudo swapon /mnt/codegen.swap; then
            swapon --show
          else
            echo "::warning::Could not add swap"
          fi

      - name: Install dependencies and run code generation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate localizations and format
        run: |
          flutter gen-l10n
          dart format lib test

      - name: Commit the generated and formatted files back
        run: |
          if [ -n "$(git status --porcelain lib test)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add lib test
            git commit -m "chore: apply dart format and regenerate localizations"
            git push origin "HEAD:${{ inputs.branch }}"
          else
            echo "Nothing to commit: already formatted and generated."
          fi

      - name: Analyze
        run: flutter analyze

      - name: Tests
        env:
          TESTS: ${{ inputs.tests }}
        run: flutter test $TESTS
